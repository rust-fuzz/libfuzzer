[package]
name = "example_init-fuzz"
version = "0.1.0"
authors = ["Andrea Cappa"]
edition = "2018"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { path = "../..", features = ["fuzz_macro"] }
example_init = { path = ".." }

[[bin]]
name = "bigbang"
path = "fuzz_targets/bigbang.rs"
test = false

[[bin]]
name = "bigbang-main"
path = "fuzz_targets/bigbang_main.rs"
test = false
