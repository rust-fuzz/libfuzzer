[package]
name = "example-fuzz"
version = "0.1.0"
authors = ["Simonas Kazlauskas <git@kazlauskas.me>"]
edition = "2018"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { path = "../..", features = ["fuzz_macro"] }
example = { path = ".." }

[[bin]]
name = "bananas"
path = "fuzz_targets/bananas.rs"
test = false

[[bin]]
name = "bananas-main"
path = "fuzz_targets/bananas_main.rs"
test = false

[[bin]]
name = "segfault-main"
path = "fuzz_targets/segfault_main.rs"
test = false
